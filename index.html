<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMH STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#5B21B6;--violet-bright:#7C3AED;--violet-glow:#A778FF;--violet-hover:#4C1D95;
  --violet-soft:rgba(124,58,237,.14);
  --ink:#F4F2F8;--muted:#6F6885;--line:#1A1526;--bg:#0A0810;--surface:#0D0A14;--field:#14101E;
  --ok:#3ecf8e;--err:#e07070;
}
*{margin:0;padding:0;box-sizing:border-box}
h1,h2,h3,.logo,.eyebrow,.chip,.add,.card-cat,.card-name,.price,.checkout,.lang,
.drawer-head h3,.t-label,.t-val,.ci-name,.ci-price,.badge,.m-name,.m-price,.m-cat,.m-add,.sizes b{
  font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* AURORA */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
header,.hero,.filters,.wrap,footer{position:relative;z-index:1}

/* ---------- INTRO: BARRIDO DE LUZ ---------- */
#intro{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;
  align-items:center;justify-content:center;overflow:hidden;animation:introOut .55s ease 2s forwards}
.intro-beam{position:absolute;top:0;bottom:0;width:42vw;left:-42vw;
  background:linear-gradient(90deg,transparent,rgba(167,120,255,.55),transparent);
  filter:blur(22px);animation:beamSweep 1.5s ease-in-out .2s forwards}
.intro-logo{position:relative;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;
  font-size:clamp(40px,12vw,88px);letter-spacing:3px;color:#fff;
  opacity:0;clip-path:inset(0 100% 0 0);animation:beamReveal 1.5s ease .2s forwards}
.intro-logo span{color:var(--violet-glow)}
@keyframes beamSweep{to{left:100%}}
@keyframes beamReveal{0%{opacity:0;clip-path:inset(0 100% 0 0)}55%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#intro{animation:introOut .3s ease .2s forwards}.intro-logo{animation:none;opacity:1;clip-path:none}.intro-beam{display:none}}

/* entrada del hero */
.hero-inner>*{opacity:0;transform:translateY(20px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.hero-inner .eyebrow{animation-delay:2.15s}
.hero-inner h1{animation-delay:2.3s}
.hero-inner p{animation-delay:2.45s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
/* entrada escalonada de las tarjetas */
.card{opacity:0;transform:translateY(24px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
@media(prefers-reduced-motion:reduce){.hero-inner>*,.card{opacity:1;transform:none;animation:none}}

/* HEADER */
header{position:sticky;top:0;z-index:40;background:rgba(10,8,16,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1200px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:26px;letter-spacing:2px;color:#fff}
.logo span{color:var(--violet-glow)}
.nav-actions{display:flex;align-items:center;gap:9px}
.lang{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px;letter-spacing:1px;
  color:var(--violet-glow);background:var(--surface)}
.cart-btn{position:relative;background:var(--violet-bright);color:#fff;width:44px;height:44px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(124,58,237,.45);transition:.2s}
.cart-btn:hover{background:var(--violet-hover)}
.cart-count{position:absolute;top:-4px;right:-4px;background:var(--violet-glow);color:#0A0810;font-size:11px;
  font-weight:700;min-width:20px;height:20px;border-radius:999px;display:flex;align-items:center;
  justify-content:center;padding:0 5px;border:2px solid var(--bg)}

/* HERO */
.hero{border-bottom:1px solid var(--line)}
.hero-inner{max-width:1200px;margin:0 auto;padding:64px 20px 54px;text-align:center}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:4px;color:var(--violet-glow);
  background:var(--violet-soft);border:1px solid rgba(124,58,237,.28);padding:7px 16px;border-radius:999px;margin-bottom:22px}
.hero h1{font-size:clamp(62px,16vw,132px);line-height:.86;letter-spacing:2px;color:#fff}
.hero h1 em{font-style:normal;color:var(--violet-glow)}
.hero p{margin:20px auto 0;max-width:480px;color:var(--muted);font-size:15px}

/* FILTROS */
.filters{position:sticky;top:70px;z-index:30;background:rgba(10,8,16,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.filters-inner{max-width:1200px;margin:0 auto;padding:11px 18px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters-inner::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:9px 17px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);font-size:13px;letter-spacing:1px;transition:.18s}
.chip.active{background:var(--violet-bright);color:#fff;border-color:var(--violet-bright)}

/* GRID */
.wrap{max-width:1200px;margin:0 auto;padding:26px 10px 90px}
/* SECCIONES POR CATEGORÍA (banner estilo Zerufy) */
.cat-section{margin-bottom:30px}
.cat-banner{position:relative;width:100%;padding:20px 22px;margin-bottom:12px;border-radius:14px;
  overflow:hidden;background:linear-gradient(135deg,#140F22,#1C1030,#140F22);border:1px solid var(--line)}
.cat-banner::after{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 150% at 100% 0,rgba(124,58,237,.28),transparent 60%);pointer-events:none}
.cat-banner-label{position:relative;z-index:1;font-family:'Anton',sans-serif;text-transform:uppercase;
  font-size:10px;letter-spacing:4px;color:var(--violet-glow);margin-bottom:4px}
.cat-banner-title{position:relative;z-index:1;font-family:'Anton',sans-serif;text-transform:uppercase;
  font-size:clamp(30px,8vw,44px);letter-spacing:2px;color:#fff;line-height:1}
.cat-banner-line{position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(to right,var(--violet-bright),transparent)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;overflow:hidden;
  display:flex;flex-direction:column;transition:.22s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 44px rgba(124,58,237,.2);border-color:rgba(124,58,237,.45)}
.card.sold{opacity:.62}
.card-img{aspect-ratio:1/1;background:linear-gradient(140deg,#14101E,#1B1626);overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;transition:.4s}
.card:hover .card-img img{transform:scale(1.05)}
.noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;opacity:.35}
.tags{position:absolute;top:9px;left:9px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.badge{font-size:10px;letter-spacing:1px;padding:4px 9px;border-radius:7px;color:#fff}
.b-new{background:var(--ok);color:#062;font-weight:700}
.b-feat{background:var(--violet-bright)}
.b-sold{background:var(--err);color:#3a0d0d}
.card-body{padding:12px;display:flex;flex-direction:column;flex:1}
.card-cat{font-size:10px;letter-spacing:2.5px;color:var(--violet-glow)}
.card-name{font-size:15px;letter-spacing:.5px;margin:5px 0 3px;line-height:1.1;color:#fff}
.card-desc{font-size:12px;color:var(--muted);margin-bottom:10px;flex:1}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-size:21px;letter-spacing:.5px;color:var(--violet-glow);line-height:1}
.price s{display:block;font-size:12px;color:var(--muted);letter-spacing:0}
.add{background:var(--violet-soft);color:var(--violet-glow);font-size:11px;letter-spacing:1.5px;
  padding:8px 12px;border-radius:9px;transition:.18s;white-space:nowrap}
.add:hover{background:var(--violet-bright);color:#fff}
.add:disabled{opacity:.4;cursor:not-allowed}

.state{text-align:center;padding:80px 20px;color:var(--muted)}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--violet-bright);
  border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL PRODUCTO */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);z-index:50;
  opacity:0;pointer-events:none;transition:.25s}
.overlay.open{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.m-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;max-width:460px;width:100%;
  max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.m-photos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.m-photos::-webkit-scrollbar{display:none}
.m-photos img{width:100%;flex:0 0 100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center}
.m-body{padding:20px}
.m-cat{font-size:11px;letter-spacing:2px;color:var(--violet-glow)}
.m-name{font-size:22px;letter-spacing:.5px;margin:6px 0 10px;line-height:1.05;color:#fff}
.m-price{font-size:27px;letter-spacing:.5px;color:var(--violet-glow);line-height:1;margin-bottom:14px}
.m-price s{font-size:17px;color:var(--muted);margin-right:9px}
.m-desc{color:var(--muted);font-size:14px;margin-bottom:14px;white-space:pre-line}
.sizes{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  font-size:13px;color:var(--ink);margin-bottom:16px}
.sizes b{display:block;font-size:11px;letter-spacing:1.5px;color:var(--muted);margin-bottom:3px}
.m-actions{display:flex;gap:9px}
.m-add{flex:1;background:var(--violet-bright);color:#fff;font-size:16px;letter-spacing:1.5px;
  padding:14px;border-radius:12px;transition:.2s}
.m-add:hover{background:var(--violet-hover)}
.m-add:disabled{opacity:.45;cursor:not-allowed}
.m-close{background:var(--field);color:var(--muted);width:52px;border-radius:12px;font-size:20px}

/* CARRITO */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:60;
  transform:translateX(100%);transition:.32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:-20px 0 60px rgba(0,0,0,.65)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-head h3{font-size:22px;letter-spacing:1px;color:#fff}
.close-x{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.06);font-size:20px;
  color:var(--muted);display:flex;align-items:center;justify-content:center}
.drawer-body{flex:1;overflow-y:auto;padding:10px 19px}
.cart-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.cart-item img,.cart-item .noimg2{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#1B1626;
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:16px;letter-spacing:.5px;color:#fff}
.ci-price{color:var(--violet-glow);font-size:18px;letter-spacing:.5px;margin-top:3px}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty button{width:26px;height:26px;border-radius:8px;background:var(--violet-soft);color:var(--violet-glow);font-weight:700}
.qty span{font-weight:600;min-width:18px;text-align:center;font-size:14px}
.ci-remove{color:var(--err);font-size:12px;font-weight:600;margin-top:6px;cursor:pointer}
.drawer-foot{padding:19px;border-top:1px solid var(--line)}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px}
.t-label{font-size:15px;letter-spacing:1px;color:var(--muted)}
.t-val{font-size:34px;letter-spacing:1px;color:var(--violet-glow)}
.checkout{width:100%;background:var(--violet-bright);color:#fff;font-size:17px;letter-spacing:1.5px;padding:16px;
  border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s;
  box-shadow:0 8px 30px rgba(124,58,237,.4)}
.checkout:hover{background:var(--violet-hover)}
.checkout:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.cart-empty{text-align:center;padding:60px 20px;color:var(--muted)}

footer{border-top:1px solid var(--line);padding:32px 20px;text-align:center;color:var(--muted);font-size:13px}
footer .logo{font-size:20px;margin-bottom:8px}
</style>
</head>
<body>

<div id="intro"><div class="intro-beam"></div><div class="intro-logo">AMH<span>·</span>STORE</div></div>

<canvas id="bgCanvas"></canvas>

<header>
  <div class="nav">
    <div class="logo">AMH<span>·</span>STORE</div>
    <div class="nav-actions">
      <button class="lang" id="langBtn">🌐 <span id="langLabel">EN</span></button>
      <button class="cart-btn" id="cartBtn" aria-label="cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" id="cartCount" style="display:none">0</span>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <span class="eyebrow" id="heroEyebrow">Relojes · Joyería · Accesorios</span>
    <h1>AMH <em>STORE</em></h1>
    <p id="heroTag">Piezas seleccionadas. Estilo que se lleva puesto.</p>
  </div>
</section>

<div class="filters"><div class="filters-inner" id="filters"></div></div>

<div class="wrap">
  <div id="grid"></div>
  <div id="stateBox" class="state"><div class="spinner"></div><p id="loadingText">Cargando catálogo…</p></div>
</div>

<footer>
  <div class="logo">AMH<span>·</span>STORE</div>
  <p>© <span id="year"></span> AMH STORE · <span id="footTag">Escríbenos por WhatsApp para comprar</span></p>
</footer>

<div class="overlay" id="overlay"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="m-box" id="mBox"></div>
</div>

<!-- CARRITO -->
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3 id="cartTitle">Tu carrito</h3>
    <button class="close-x" id="closeCart">×</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot">
    <div class="total-row"><span class="t-label" id="totalLabel">Total</span><span class="t-val" id="totalVal">$0</span></div>
    <button class="checkout" id="checkout" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.6.1-.2.3-.7 1-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5C9.7 8.7 9 7.1 8.8 6.5c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.3.3-1 .9-1 2.3s1 2.7 1.2 2.9c.1.2 2 3 4.8 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15l-1.3 4.8 5-1.3A10 10 0 1 0 12 2z"/></svg>
      <span id="checkoutText">Comprar por WhatsApp</span>
    </button>
  </div>
</aside>

<script>
/* ============================================================
   👇👇  CONFIG — IGUAL QUE EN EL ADMIN  👇👇
   ============================================================ */
const CONFIG = {
  SUPABASE_URL : "https://qiphngqxwsigmpjhroqv.supabase.co",
  SUPABASE_KEY : "sb_publishable_TgsDBkfyOEHncvcBhjwtsQ_xvC5-Ay6",
  TABLE        : "productos",
  WHATSAPP     : "16292025713"
};
/* ============================================================ */

const T={
 es:{lang:"EN",eyebrow:"Relojes · Joyería · Accesorios",tag:"Piezas seleccionadas. Estilo que se lleva puesto.",
     loading:"Cargando catálogo…",empty:"Pronto agregamos productos aquí.",all:"Todo",add:"Agregar",
     cart:"Tu carrito",cartEmpty:"Tu carrito está vacío",total:"Total",checkout:"Comprar por WhatsApp",
     foot:"Escríbenos por WhatsApp para comprar",hi:"Hola AMH STORE 👋 Quiero pedir:",totalWord:"Total",
     ask:"Consultar",sold:"Agotado",sizes:"Medidas / Tallas",remove:"Quitar",addCart:"Agregar al carrito",newColl:"Colección"},
 en:{lang:"ES",eyebrow:"Watches · Jewelry · Accessories",tag:"Curated pieces. Style you actually wear.",
     loading:"Loading catalog…",empty:"Products coming soon.",all:"All",add:"Add",
     cart:"Your cart",cartEmpty:"Your cart is empty",total:"Total",checkout:"Checkout on WhatsApp",
     foot:"Message us on WhatsApp to order",hi:"Hi AMH STORE 👋 I'd like to order:",totalWord:"Total",
     ask:"Ask price",sold:"Sold out",sizes:"Sizes / Measurements",remove:"Remove",addCart:"Add to cart",newColl:"Collection"}
};

let lang="es",products=[],activeCat="__all__",cart={};
const $=id=>document.getElementById(id);
const money=n=>"$"+Number(n).toLocaleString("en-US",{maximumFractionDigits:0});
const finalPrice=p=>p.discount_price!=null?p.discount_price:p.precio;
const photo=p=>Array.isArray(p.fotos)&&p.fotos.length?p.fotos[0]:null;

/* ---------- TRADUCCIÓN AUTOMÁTICA (es → en) ---------- */
const txCache={};
async function tx(text){
  if(!text||lang!=="en") return text;
  if(txCache[text]) return txCache[text];
  try{
    const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q="+encodeURIComponent(text);
    const r=await fetch(url); const d=await r.json();
    let out=""; if(d&&d[0]) d[0].forEach(x=>{if(x[0])out+=x[0];});
    if(out) txCache[text]=out;
    return out||text;
  }catch(e){return text;}
}
async function translateView(){
  if(lang!=="en") return;
  const els=document.querySelectorAll("[data-tx]");
  for(const el of els){
    const original=el.getAttribute("data-tx");
    if(original) el.textContent=await tx(original);
  }
}

async function load(){
  try{
    const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABLE}?select=*&order=sort_order.asc`,
      {headers:{apikey:CONFIG.SUPABASE_KEY,Authorization:"Bearer "+CONFIG.SUPABASE_KEY}});
    if(!r.ok) throw new Error(r.status);
    const all=await r.json();
    products=all.filter(p=>!p.hidden).sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
    $("stateBox").style.display="none";
    renderFilters();renderGrid();
  }catch(e){
    $("stateBox").innerHTML=`<p style="color:var(--err)">No se pudo cargar el catálogo.<br><small>Revisa la config de Supabase.</small></p>`;
  }
}

function renderFilters(){
  const t=T[lang];
  const cats=[...new Set(products.map(p=>p.categoria).filter(Boolean))];
  let html=`<button class="chip ${activeCat==='__all__'?'active':''}" data-c="__all__">${t.all}</button>`;
  cats.forEach(c=>html+=`<button class="chip ${activeCat===c?'active':''}" data-c="${c}" data-tx="${c}">${c}</button>`);
  $("filters").innerHTML=html;
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{activeCat=b.dataset.c;renderFilters();renderGrid();});
  translateView();
}

function priceHTML(p,t){
  if(p.precio==null&&p.discount_price==null) return t.ask;
  if(p.discount_price!=null) return `<s>${money(p.precio)}</s>${money(p.discount_price)}`;
  return money(p.precio);
}

function cardHTML(p,delay,t){
  const f=photo(p);
  const tags=[p.is_new?`<span class="badge b-new">New</span>`:'',
              p.featured?`<span class="badge b-feat">★</span>`:'',
              p.sold_out?`<span class="badge b-sold">${t.sold}</span>`:''].join("");
  return `<div class="card ${p.sold_out?'sold':''}" style="animation-delay:${delay}ms" onclick="openModal(${p.id})">
      <div class="card-img">
        <div class="tags">${tags}</div>
        ${f?`<img src="${f}" alt="${p.nombre}" loading="lazy" onerror="this.style.opacity=.15">`:'<div class="noimg">📷</div>'}
      </div>
      <div class="card-body">
        <span class="card-cat" data-tx="${p.categoria||''}">${p.categoria||''}</span>
        <div class="card-name">${p.nombre}</div>
        <div class="card-desc" data-tx="${(p.descripcion_breve||'').replace(/"/g,'&quot;')}">${p.descripcion_breve||''}</div>
        <div class="card-foot">
          <span class="price">${priceHTML(p,t)}</span>
          <button class="add" onclick="event.stopPropagation();addToCart(${p.id})" ${p.sold_out?'disabled':''}>
            ${p.sold_out?t.sold:t.add}
          </button>
        </div>
      </div>
    </div>`;
}

function renderGrid(){
  const t=T[lang];
  const list=activeCat==="__all__"?products:products.filter(p=>p.categoria===activeCat);
  if(!list.length){$("grid").innerHTML=`<div class="state">${t.empty}</div>`;return;}

  // agrupar por categoría, en el orden en que aparecen
  const order=[], groups={};
  list.forEach(p=>{
    const c=p.categoria||"—";
    if(!groups[c]){groups[c]=[];order.push(c);}
    groups[c].push(p);
  });

  const introDone=document.body.classList.contains("ready");
  let idx=0, html="";
  order.forEach(cat=>{
    const label = t.lang==="ES" ? "Colección" : "Colección"; // etiqueta pequeña
    html+=`<section class="cat-section" id="sec-${cat.replace(/\s+/g,'-')}">
      <div class="cat-banner">
        <div class="cat-banner-label">${t.newColl}</div>
        <div class="cat-banner-title" data-tx="${cat}">${cat}</div>
        <div class="cat-banner-line"></div>
      </div>
      <div class="grid">`;
    groups[cat].forEach(p=>{
      const delay=introDone?Math.min(idx*60,700):2400+Math.min(idx*70,800);
      html+=cardHTML(p,delay,t);
      idx++;
    });
    html+=`</div></section>`;
  });
  $("grid").innerHTML=html;
  translateView();
}

/* ---------- MODAL ---------- */
function openModal(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  const t=T[lang];
  const fotos=Array.isArray(p.fotos)?p.fotos:[];
  $("mBox").innerHTML=`
    ${fotos.length?`<div class="m-photos">${fotos.map(f=>`<img src="${f}" alt="${p.nombre}">`).join("")}</div>`:''}
    <div class="m-body">
      <div class="m-cat" data-tx="${p.categoria||''}">${p.categoria||''}</div>
      <div class="m-name">${p.nombre}</div>
      <div class="m-price">${priceHTML(p,t)}</div>
      ${p.descripcion?`<div class="m-desc" data-tx="${(p.descripcion||'').replace(/"/g,'&quot;')}">${p.descripcion}</div>`:''}
      ${p.medidas?`<div class="sizes"><b>${t.sizes}</b>${p.medidas}</div>`:''}
      <div class="m-actions">
        <button class="m-add" onclick="addToCart(${p.id});closeModal()" ${p.sold_out?'disabled':''}>
          ${p.sold_out?t.sold:t.addCart}
        </button>
        <button class="m-close" onclick="closeModal()">×</button>
      </div>
    </div>`;
  $("modal").classList.add("open");$("overlay").classList.add("open");
  translateView();
}
function closeModal(){$("modal").classList.remove("open");if(!$("drawer").classList.contains("open"))$("overlay").classList.remove("open");}

/* ---------- CARRITO ---------- */
function addToCart(id){
  const p=products.find(x=>x.id===id);
  if(!p||p.sold_out)return;
  if(cart[id])cart[id].qty++;else cart[id]={...p,qty:1};
  renderCart();openCart();
}
function changeQty(id,d){if(!cart[id])return;cart[id].qty+=d;if(cart[id].qty<=0)delete cart[id];renderCart();}
function removeItem(id){delete cart[id];renderCart();}
const cartTotal=()=>Object.values(cart).reduce((s,i)=>s+(Number(finalPrice(i))||0)*i.qty,0);
const cartCount=()=>Object.values(cart).reduce((s,i)=>s+i.qty,0);

function renderCart(){
  const t=T[lang],items=Object.values(cart),c=cartCount();
  $("cartCount").style.display=c?"flex":"none";$("cartCount").textContent=c;
  if(!items.length){
    $("cartBody").innerHTML=`<div class="cart-empty">🛍️<br><br>${t.cartEmpty}</div>`;
    $("checkout").disabled=true;
  }else{
    $("cartBody").innerHTML=items.map(i=>{
      const f=photo(i);
      return `<div class="cart-item">
        ${f?`<img src="${f}" onerror="this.style.opacity=.15">`:'<div class="noimg2">📷</div>'}
        <div class="ci-info">
          <div class="ci-name">${i.nombre}</div>
          <div class="ci-price">${finalPrice(i)!=null?money(finalPrice(i)):t.ask}</div>
          <div class="qty">
            <button onclick="changeQty(${i.id},-1)">−</button><span>${i.qty}</span>
            <button onclick="changeQty(${i.id},1)">+</button>
          </div>
          <div class="ci-remove" onclick="removeItem(${i.id})">${t.remove}</div>
        </div>
      </div>`;}).join("");
    $("checkout").disabled=false;
  }
  $("totalVal").textContent=money(cartTotal());
}

function openCart(){$("drawer").classList.add("open");$("overlay").classList.add("open");}
function closeCart(){$("drawer").classList.remove("open");if(!$("modal").classList.contains("open"))$("overlay").classList.remove("open");}

function checkout(){
  const t=T[lang],items=Object.values(cart);if(!items.length)return;
  let msg=t.hi+"\n\n";
  items.forEach(i=>{
    const pr=finalPrice(i);
    msg+=`• ${i.nombre}${i.categoria?` (${i.categoria})`:''} x${i.qty} — ${pr!=null?money(pr*i.qty):t.ask}\n`;
  });
  msg+=`\n${t.totalWord}: ${money(cartTotal())}`;
  window.open(`https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
}

function applyLang(){
  const t=T[lang];
  $("langLabel").textContent=t.lang;$("heroEyebrow").textContent=t.eyebrow;$("heroTag").textContent=t.tag;
  $("loadingText").textContent=t.loading;$("cartTitle").textContent=t.cart;$("totalLabel").textContent=t.total;
  $("checkoutText").textContent=t.checkout;$("footTag").textContent=t.foot;
  renderFilters();renderGrid();renderCart();
}

$("langBtn").onclick=()=>{lang=lang==="es"?"en":"es";applyLang();};
$("cartBtn").onclick=openCart;
$("closeCart").onclick=closeCart;
$("overlay").onclick=()=>{closeModal();closeCart();};
$("checkout").onclick=checkout;
/* ---------- FONDO: HUMO + BRASAS ---------- */
(function(){
  const cv=document.getElementById("bgCanvas");
  if(!cv) return;
  const ctx=cv.getContext("2d");
  let W,H,DPR,clouds=[],sparks=[];
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const R=(a,b)=>Math.random()*(b-a)+a;
  function size(){DPR=Math.min(window.devicePixelRatio||1,2);
    W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
    cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";}
  function make(){
    clouds=[];for(let i=0;i<9;i++)clouds.push({x:R(0,W),y:R(0,H),r:R(150,270)*DPR,vx:R(-.18,.18)*DPR,vy:R(-.14,.14)*DPR,a:R(.05,.13),h:R(255,285)});
    sparks=[];const n=innerWidth<700?45:80;
    for(let i=0;i<n;i++)sparks.push({x:R(0,W),y:R(0,H),r:R(.8,2.1)*DPR,vy:R(-.4,-.14)*DPR,vx:R(-.06,.06)*DPR,a:R(.25,.75),ph:R(0,6.28),sp:R(.012,.032)});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(const o of clouds){o.x+=o.vx;o.y+=o.vy;
      if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;if(o.y<-o.r)o.y=H+o.r;if(o.y>H+o.r)o.y=-o.r;
      const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0,`hsla(${o.h},70%,55%,${o.a})`);g.addColorStop(1,"hsla(270,70%,50%,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.283);ctx.fill();}
    for(const p of sparks){p.x+=p.vx;p.y+=p.vy;p.ph+=p.sp;
      if(p.y<-4)p.y=H+4;if(p.x<-4)p.x=W+4;if(p.x>W+4)p.x=-4;
      const a=p.a*(.5+.5*Math.sin(p.ph));
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle=`rgba(190,155,255,${a})`;ctx.shadowBlur=9*DPR;ctx.shadowColor="rgba(124,58,237,.9)";ctx.fill();}
    ctx.shadowBlur=0;ctx.globalCompositeOperation="source-over";
    requestAnimationFrame(draw);
  }
  size();make();
  if(reduce){ // fondo estático suave
    ctx.globalCompositeOperation="lighter";
    for(const o of clouds){const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0,`hsla(${o.h},70%,55%,${o.a})`);g.addColorStop(1,"hsla(270,70%,50%,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.283);ctx.fill();}
    ctx.globalCompositeOperation="source-over";
  }else draw();
  let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{size();make();},200);});
})();

$("year").textContent=new Date().getFullYear();
load();
setTimeout(()=>document.body.classList.add("ready"),2600);
</script>
