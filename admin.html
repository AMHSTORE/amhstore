<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMH STORE — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --violet:#5B21B6;--violet-bright:#7C3AED;--violet-glow:#A778FF;--violet-hover:#4C1D95;
  --violet-soft:rgba(124,58,237,.14);
  --ink:#F4F2F8;--muted:#6F6885;--line:#1A1526;--bg:#0A0810;--surface:#0D0A14;--field:#14101E;
  --ok:#3ecf8e;--err:#e07070;--warn:#e0b400;
}
*{margin:0;padding:0;box-sizing:border-box}
h1,h2,h3,.logo,.btn,.chip,.sec-title,.it-cat,.it-name,.it-price,label,.mini,.badge,.tag-pill{
  font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:'Inter',sans-serif}

#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.au{position:absolute;border-radius:50%;filter:blur(130px);opacity:.26}
.au1{width:66vw;height:66vw;background:#4C1D95;top:-22vw;left:-14vw;animation:a1 26s ease-in-out infinite alternate}
.au2{width:52vw;height:52vw;background:#5B21B6;bottom:-20vw;right:-12vw;animation:a2 32s ease-in-out infinite alternate}
.au3{width:42vw;height:42vw;background:#2E0B5C;top:38%;left:42%;animation:a3 22s ease-in-out infinite alternate}
@keyframes a1{to{transform:translate(14vw,10vh) scale(1.18)}}
@keyframes a2{to{transform:translate(-12vw,-8vh) scale(1.12)}}
@keyframes a3{to{transform:translate(-16vw,12vh) scale(.85)}}
@media(prefers-reduced-motion:reduce){.au{animation:none}}
.gate,.app{position:relative;z-index:1}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:38px 28px;
  max-width:380px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.6);text-align:center}
.logo{font-size:34px;letter-spacing:2px;color:#fff}
.logo span{color:var(--violet-glow)}
.gate-sub{color:var(--muted);font-size:13px;margin:6px 0 26px;letter-spacing:1px}

label{display:block;font-size:12px;letter-spacing:1.5px;color:var(--muted);margin-bottom:7px}
.field{margin-bottom:15px;text-align:left}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;
  background:var(--field);color:var(--ink);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet-bright);box-shadow:0 0 0 3px var(--violet-soft)}
textarea{min-height:74px;resize:vertical}
.btn{background:var(--violet-bright);color:#fff;font-size:16px;letter-spacing:1.5px;padding:14px;
  border-radius:12px;width:100%;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--violet-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:var(--violet-soft);color:var(--violet-glow)}
.btn-ghost:hover{background:rgba(124,58,237,.3)}
.err{color:var(--err);font-size:13px;margin-top:12px;display:none}

.app{max-width:1000px;margin:0 auto;padding:18px 14px 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.topbar .logo{font-size:24px}
.top-links{display:flex;gap:8px}
.tlink{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12px;
  letter-spacing:1px;padding:9px 14px;border-radius:999px;text-decoration:none;
  font-family:'Anton',sans-serif;text-transform:uppercase}
.tlink:hover{color:var(--violet-glow);border-color:var(--violet-bright)}

.tabbar{display:flex;gap:8px;margin-bottom:16px}
.tabbtn{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12px;
  letter-spacing:1.5px;padding:10px 16px;border-radius:999px;font-family:'Anton',sans-serif;text-transform:uppercase}
.tabbtn.on{background:var(--violet-bright);color:#fff;border-color:var(--violet-bright)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.sec-title{font-size:18px;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;
  justify-content:space-between;gap:10px}
.sec-title small{font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0;
  font-size:12px;color:var(--muted);font-weight:400}

.cats{display:flex;flex-wrap:wrap;gap:8px}
.tag-pill{display:flex;align-items:center;gap:7px;background:var(--field);border:1px solid var(--line);
  color:var(--ink);font-size:13px;letter-spacing:1px;padding:8px 12px;border-radius:999px}
.tag-pill button{background:none;color:var(--err);font-size:16px;line-height:1;opacity:.65}
.tag-pill button:hover{opacity:1}
.add-cat{background:var(--violet-soft);color:var(--violet-glow);font-family:'Anton',sans-serif;
  text-transform:uppercase;font-size:13px;letter-spacing:1px;padding:8px 14px;border-radius:999px}

.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1px solid var(--line);
  background:var(--field);color:var(--muted);font-size:12px;letter-spacing:1px;transition:.15s}
.chip.on{background:var(--violet-bright);color:#fff;border-color:var(--violet-bright)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:540px){.row2{grid-template-columns:1fr}}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}
.slot{aspect-ratio:1/1;border:2px dashed var(--line);border-radius:13px;background:var(--field);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;
  color:var(--muted);font-size:11px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.slot:hover{border-color:var(--violet-bright);color:var(--violet-glow)}
.slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.slot .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:8px;
  background:rgba(10,8,16,.85);color:var(--err);font-size:15px;display:flex;
  align-items:center;justify-content:center;z-index:2}
.slot .num{position:absolute;bottom:5px;left:5px;background:rgba(10,8,16,.85);color:var(--violet-glow);
  font-size:10px;padding:2px 6px;border-radius:6px;font-family:'Anton',sans-serif;z-index:2}

.switches{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
@media(max-width:540px){.switches{grid-template-columns:1fr}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--field);
  border:1px solid var(--line);border-radius:13px;padding:11px 13px;cursor:pointer;transition:.15s}
.sw.on{border-color:var(--violet-bright);background:var(--violet-soft)}
.sw-txt b{display:block;font-family:'Anton',sans-serif;text-transform:uppercase;font-size:13px;letter-spacing:1px}
.sw-txt small{font-size:11px;color:var(--muted)}
.knob{width:44px;height:25px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;transition:.2s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:var(--muted);transition:.2s}
.sw.on .knob{background:var(--violet-bright)}
.sw.on .knob::after{left:22px;background:#fff}

.status{display:none;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600;margin-bottom:14px}
.status.ok{background:rgba(62,207,142,.14);color:var(--ok);display:block}
.status.bad{background:rgba(224,112,112,.14);color:var(--err);display:block}
.status.load{background:var(--violet-soft);color:var(--violet-glow);display:block}
.form-actions{display:flex;gap:10px}

/* SELECCION MULTIPLE (nuevo) */
.bulk-bar{display:none;background:var(--field);border:1px solid var(--violet-bright);border-radius:14px;
  padding:12px 14px;margin-bottom:14px;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.bulk-bar.on{display:flex}
.bulk-bar b{color:var(--violet-glow)}
.bulk-bar .sp{flex:1}
.bulk-bar button{background:var(--violet-soft);color:var(--violet-glow);font-size:11px;letter-spacing:.5px;
  padding:7px 12px;border-radius:999px;font-family:'Inter',sans-serif;font-weight:600}
.bulk-bar button:hover{background:var(--violet-bright);color:#fff}

.item{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid var(--line);
  border-radius:14px;margin-bottom:9px;background:var(--field);transition:.15s}
.item.dim{opacity:.45}
.item.selected{border-color:var(--violet-bright);background:var(--violet-soft)}
.item .psel{width:19px;height:19px;accent-color:var(--violet-bright);flex-shrink:0;cursor:pointer}
.item img,.item .noimg{width:60px;height:60px;border-radius:11px;object-fit:cover;
  background:#1B1626;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:20px}
.it-info{flex:1;min-width:0}
.it-cat{font-size:10px;letter-spacing:2px;color:var(--violet-glow)}
.it-name{font-size:16px;letter-spacing:.5px;color:#fff;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.2;margin:2px 0}
.it-price{font-size:18px;letter-spacing:1px;color:var(--violet-glow)}
.it-price s{color:var(--muted);font-size:13px;margin-right:6px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:6px}
.b-new{background:rgba(62,207,142,.18);color:var(--ok)}
.b-feat{background:rgba(224,180,0,.16);color:var(--warn)}
.b-sold{background:rgba(224,112,112,.16);color:var(--err)}
.b-hide{background:rgba(111,104,133,.2);color:var(--muted)}
.arrows{display:flex;flex-direction:column;gap:3px}
.mini{width:30px;height:25px;border-radius:8px;background:var(--violet-soft);color:var(--violet-glow);font-size:13px}
.mini:hover{background:var(--violet-bright);color:#fff}
.it-btns{display:flex;flex-direction:column;gap:5px}
.ib{width:34px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px}
.ib-edit{background:var(--violet-soft);color:var(--violet-glow)}
.ib-del{background:rgba(224,112,112,.14);color:var(--err)}
.empty{text-align:center;color:var(--muted);padding:34px;font-size:14px}

/* PEDIDOS (nuevo) */
.order-card{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.order-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.order-num{font-family:'Anton',sans-serif;font-size:18px;color:var(--violet-glow);letter-spacing:1px}
.order-date{font-size:11px;color:var(--muted)}
.order-cust{font-size:15px;font-weight:600;color:#fff}
.order-phone{font-size:12px;color:var(--muted);margin-bottom:8px}
.order-addr{font-size:12px;color:var(--ink);background:var(--surface);border-radius:10px;padding:8px 11px;margin-bottom:8px}
.order-items{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:10px}
.order-foot{display:flex;justify-content:space-between;align-items:center}
.order-total{font-family:'Anton',sans-serif;font-size:17px;color:var(--violet-glow)}
.order-status{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;
  font-size:11px;color:var(--ink);font-family:'Inter',sans-serif}
</style>
</head>
<body>

<div id="aurora"><div class="au au1"></div><div class="au au2"></div><div class="au au3"></div></div>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="logo">AMH<span>·</span>STORE</div>
    <div class="gate-sub">Panel de administración</div>
    <div class="field">
      <label>Correo</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Entrar</button>
    <div class="err" id="loginErr">Correo o contraseña incorrectos</div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <div class="topbar">
    <div class="logo">AMH<span>·</span>STORE</div>
    <div class="top-links">
      <a class="tlink" href="https://amhstore.store" target="_blank">Ver catálogo</a>
      <button class="tlink" onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="tabbar">
    <button class="tabbtn on" id="tabProducts" onclick="showTab('products')">Productos</button>
    <button class="tabbtn" id="tabOrders" onclick="showTab('orders')">Pedidos</button>
  </div>

  <div id="viewProducts">

    <div class="panel">
      <div class="sec-title">Categorías <button class="add-cat" onclick="addCat()">+ Agregar</button></div>
      <div class="cats" id="cats"></div>
    </div>

    <div class="panel">
      <div class="sec-title" id="formTitle">+ Agregar producto</div>
      <div class="status" id="status"></div>

      <label>Fotos (máximo 3) — se comprimen solas</label>
      <div class="photos" id="photos"></div>
      <input type="file" id="file" accept="image/*" multiple style="display:none" onchange="pickFiles(event)">

      <div class="field"><label>Nombre del producto</label><input type="text" id="fName" placeholder="Ej. Cartier Santos"></div>
      <div class="field"><label>Categoría</label><select id="fCat"></select></div>

      <div class="row2">
        <div class="field"><label>Precio ($) — vacío = "Consultar"</label><input type="number" id="fPrice" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label>Precio con descuento ($)</label><input type="number" id="fSale" inputmode="decimal" placeholder="opcional"></div>
      </div>

      <div class="field"><label>Descripción breve (tarjeta)</label><input type="text" id="fShort" placeholder="Ej. Acero · correa intercambiable"></div>
      <div class="field"><label>Descripción completa (modal)</label><textarea id="fFull" placeholder="Detalles, material, estado, garantía…"></textarea></div>
      <div class="field"><label>Medidas / Tallas disponibles</label><input type="text" id="fSizes" placeholder="Ej. 38mm · 40mm"></div>

      <div class="switches">
        <div class="sw" id="swFeat" onclick="tog('swFeat')"><div class="sw-txt"><b>Destacar</b><small>Aparece primero</small></div><div class="knob"></div></div>
        <div class="sw" id="swNew" onclick="tog('swNew')"><div class="sw-txt"><b>Etiqueta NEW</b><small>Badge verde</small></div><div class="knob"></div></div>
        <div class="sw" id="swSold" onclick="tog('swSold')"><div class="sw-txt"><b>Sold Out</b><small>Deshabilita compra</small></div><div class="knob"></div></div>
        <div class="sw" id="swHide" onclick="tog('swHide')"><div class="sw-txt"><b>Ocultar</b><small>No sale en catálogo</small></div><div class="knob"></div></div>
      </div>

      <div class="form-actions">
        <button class="btn" id="saveBtn" onclick="saveProduct()">Guardar producto</button>
        <button class="btn btn-ghost" id="cancelBtn" style="display:none;width:auto;padding:14px 20px" onclick="resetForm()">Cancelar</button>
      </div>
    </div>

    <div class="panel">
      <div class="sec-title">Productos <small id="count"></small></div>
      <div class="chips" id="filters"></div>
      <div class="bulk-bar" id="bulkBar">
        <span><b id="bulkCount">0</b> seleccionados</span>
        <div class="sp"></div>
        <button onclick="bulkSoldOut(true)">Marcar agotado</button>
        <button onclick="bulkSoldOut(false)">Marcar disponible</button>
        <button onclick="bulkPrice()">Cambiar precio</button>
        <button onclick="clearSelection()">Cancelar</button>
      </div>
      <div id="list"><div class="empty">Cargando productos…</div></div>
    </div>
  </div>

  <div id="viewOrders" style="display:none">
    <div class="panel">
      <div class="sec-title">Pedidos <small id="orderCount"></small></div>
      <div class="field" style="margin-bottom:0">
        <input type="text" id="orderSearch" placeholder="Buscar por nombre o número..." oninput="renderOrders()">
      </div>
    </div>
    <div id="ordersList"><div class="empty">Cargando pedidos…</div></div>
  </div>

</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const STORE_ID = 3;
const SUPABASE_URL = "https://drkcstmcdscklcrefxbs.supabase.co";
const SUPABASE_KEY = "sb_publishable_k4jAuf7UCzpT_kp2jSpW-A_1ICXHA2s";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
/* ============================================================ */

const $=id=>document.getElementById(id);
let categories=[], products=[], orders=[], editingId=null, existingImages=[], pendingFiles=[], filter="all", selectedIds={};

/* ---------- LOGIN (real, con sesión que se queda guardada) ---------- */
async function login(){
  const email=$("loginEmail").value.trim();
  const pass=$("pass").value;
  const err=$("loginErr");
  const btn=$("loginBtn");
  err.style.display="none";
  if(!email||!pass){err.textContent="Completa correo y contraseña.";err.style.display="block";return;}
  btn.disabled=true;btn.textContent="ENTRANDO...";
  const r=await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;btn.textContent="Entrar";
  if(r.error){err.style.display="block";return;}
  start();
}
async function logout(){await sb.auth.signOut();location.reload();}
(async function checkSession(){
  const s=await sb.auth.getSession();
  if(s.data && s.data.session) start();
})();

async function start(){
  $("gate").style.display="none";$("app").style.display="block";
  await loadCategories();renderPhotos();renderFilters();
  await loadProducts();await loadOrders();
}

function showTab(name){
  $("tabProducts").classList.toggle("on",name==="products");
  $("tabOrders").classList.toggle("on",name==="orders");
  $("viewProducts").style.display=name==="products"?"block":"none";
  $("viewOrders").style.display=name==="orders"?"block":"none";
}

function status(msg,type){const s=$("status");s.textContent=msg;s.className="status "+type;
  if(type!=="load") setTimeout(()=>s.className="status",3500);}

/* ---------- CATEGORÍAS (en la base de datos) ---------- */
async function loadCategories(){
  const r=await sb.from("categories").select("*").eq("store_id",STORE_ID).order("position");
  categories=r.data||[];renderCats();
}
function renderCats(){
  $("cats").innerHTML = categories.length
    ? categories.map(c=>`<span class="tag-pill">${c.name}<button onclick="delCat(${c.id})">×</button></span>`).join("")
    : `<span style="color:var(--muted);font-size:13px">Sin categorías todavía</span>`;
  $("fCat").innerHTML = categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");
}
async function addCat(){
  const n=prompt("Nombre de la nueva categoría:");
  if(!n||!n.trim())return;
  const v=n.trim();
  if(categories.some(c=>c.name.toLowerCase()===v.toLowerCase())){alert("Esa categoría ya existe");return;}
  const r=await sb.from("categories").insert({store_id:STORE_ID,name:v,position:categories.length}).select().single();
  if(r.error){alert("No se pudo agregar");return;}
  categories.push(r.data);renderCats();renderFilters();
}
async function delCat(id){
  const c=categories.find(x=>x.id===id);
  const used=products.filter(p=>p.category_id===id).length;
  if(used && !confirm(`${used} producto(s) usan "${c?c.name:''}". ¿Borrar la categoría igual?`))return;
  await sb.from("categories").delete().eq("id",id).eq("store_id",STORE_ID);
  categories=categories.filter(x=>x.id!==id);renderCats();renderFilters();
}

/* ---------- FOTOS (con compresión, a tu propio storage) ---------- */
function renderPhotos(){
  const total=existingImages.length+pendingFiles.length;
  let html="";
  existingImages.forEach((url,i)=>{
    html+=`<div class="slot"><img src="${url}"><span class="num">${i+1}</span><button class="x" onclick="event.stopPropagation();rmPhoto(${i})">×</button></div>`;
  });
  pendingFiles.forEach((f,i)=>{
    html+=`<div class="slot"><img src="${URL.createObjectURL(f)}"><span class="num">${existingImages.length+i+1}</span><button class="x" onclick="event.stopPropagation();rmPending(${i})">×</button></div>`;
  });
  for(let i=total;i<3;i++) html+=`<div class="slot" onclick="document.getElementById('file').click()">📷<span>Subir</span></div>`;
  $("photos").innerHTML=html;
}
function pickFiles(e){
  const files=[...e.target.files];
  const space=3-(existingImages.length+pendingFiles.length);
  if(files.length>space) alert(`Solo caben ${space} foto(s) más`);
  pendingFiles.push(...files.slice(0,space));
  e.target.value="";renderPhotos();
}
function rmPhoto(i){existingImages.splice(i,1);renderPhotos();}
function rmPending(i){pendingFiles.splice(i,1);renderPhotos();}

function compress(file){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const max=1200;let{width:w,height:h}=img;
      if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(b=>res(b),"image/jpeg",.82);
    };
    img.src=URL.createObjectURL(file);
  });
}
async function uploadImage(file){
  const blob=await compress(file);
  const path=STORE_ID+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+".jpg";
  const up=await sb.storage.from("store-products").upload(path,blob,{contentType:"image/jpeg"});
  if(up.error) throw up.error;
  return sb.storage.from("store-products").getPublicUrl(path).data.publicUrl;
}

/* ---------- TOGGLES ---------- */
function tog(id){$(id).classList.toggle("on");}
const isOn=id=>$(id).classList.contains("on");
const setSw=(id,v)=>$(id).classList.toggle("on",!!v);

/* ---------- GUARDAR ---------- */
async function saveProduct(){
  const nombre=$("fName").value.trim();
  if(!nombre){status("Escribe el nombre del producto","bad");return;}
  $("saveBtn").disabled=true;status("Guardando…","load");
  try{
    const images=[...existingImages];
    for(const f of pendingFiles) images.push(await uploadImage(f));

    const prod={
      store_id:STORE_ID,
      name:nombre,
      category_id:$("fCat").value?Number($("fCat").value):null,
      price:$("fPrice").value?Number($("fPrice").value):0,
      discount_price:$("fSale").value?Number($("fSale").value):null,
      description_short_es:$("fShort").value.trim()||null,
      description_es:$("fFull").value.trim()||null,
      medidas:$("fSizes").value.trim()||null,
      images, image_url: images[0]||null,
      featured:isOn("swFeat"),is_new:isOn("swNew"),
      sold_out:isOn("swSold"), in_stock:!isOn("swSold"),
      hidden:isOn("swHide")
    };

    let r;
    if(editingId){
      r=await sb.from("products").update(prod).eq("id",editingId).eq("store_id",STORE_ID);
      if(!r.error) status("✓ Producto actualizado","ok");
    }else{
      prod.position=products.length;
      r=await sb.from("products").insert(prod);
      if(!r.error) status("✓ Producto guardado","ok");
    }
    if(r.error) throw r.error;
    resetForm();await loadProducts();
  }catch(e){console.error(e);status("Error al guardar","bad");}
  $("saveBtn").disabled=false;
}

function resetForm(){
  editingId=null;existingImages=[];pendingFiles=[];
  ["fName","fPrice","fSale","fShort","fFull","fSizes"].forEach(id=>$(id).value="");
  ["swFeat","swNew","swSold","swHide"].forEach(id=>$(id).classList.remove("on"));
  $("formTitle").textContent="+ Agregar producto";
  $("saveBtn").textContent="Guardar producto";$("cancelBtn").style.display="none";
  renderPhotos();
}

function editProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  editingId=id;
  $("fName").value=p.name||"";
  $("fCat").value=p.category_id||"";
  $("fPrice").value=p.price??"";$("fSale").value=p.discount_price??"";
  $("fShort").value=p.description_short_es||p.description_short||"";
  $("fFull").value=p.description_es||p.description||"";
  $("fSizes").value=p.medidas||"";
  setSw("swFeat",p.featured);setSw("swNew",p.is_new);setSw("swSold",p.sold_out);setSw("swHide",p.hidden);
  existingImages=Array.isArray(p.images)?[...p.images]:(p.image_url?[p.image_url]:[]);
  pendingFiles=[];renderPhotos();
  $("formTitle").textContent="✎ Editar producto";
  $("saveBtn").textContent="Guardar cambios";$("cancelBtn").style.display="flex";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function delProduct(id,name){
  if(!confirm(`¿Borrar "${name}"? No se puede deshacer.`))return;
  await sb.from("products").delete().eq("id",id).eq("store_id",STORE_ID);
  status("Producto borrado","ok");loadProducts();
}

async function move(id,dir){
  const i=products.findIndex(p=>p.id===id),j=i+dir;
  if(j<0||j>=products.length)return;
  const a=products[i],b=products[j];
  await sb.from("products").update({position:b.position}).eq("id",a.id).eq("store_id",STORE_ID);
  await sb.from("products").update({position:a.position}).eq("id",b.id).eq("store_id",STORE_ID);
  await loadProducts();
}

/* ---------- SELECCIÓN MÚLTIPLE (igual que en Zerufy) ---------- */
function toggleSelect(id,on){
  if(on) selectedIds[id]=true; else delete selectedIds[id];
  updateBulkBar();
}
function updateBulkBar(){
  const ids=Object.keys(selectedIds);
  $("bulkBar").classList.toggle("on",ids.length>0);
  $("bulkCount").textContent=ids.length;
}
function clearSelection(){selectedIds={};updateBulkBar();renderList();}

async function bulkSoldOut(val){
  const ids=Object.keys(selectedIds).map(Number);
  for(const id of ids) await sb.from("products").update({sold_out:val,in_stock:!val}).eq("id",id).eq("store_id",STORE_ID);
  clearSelection();await loadProducts();
}
async function bulkPrice(){
  const nuevo=prompt("¿Cuál es el precio nuevo? Ej: 50");
  if(nuevo===null||nuevo.trim()==="")return;
  const precio=parseFloat(nuevo);
  if(isNaN(precio)||precio<0){alert("Escribe un precio válido. Ej: 50");return;}
  const ids=Object.keys(selectedIds).map(Number);
  for(const id of ids) await sb.from("products").update({price:precio}).eq("id",id).eq("store_id",STORE_ID);
  clearSelection();await loadProducts();
}

/* ---------- FILTROS + LISTA ---------- */
const FILTERS=[["all","Todos"],["active","Activos"],["hidden","Ocultos"],
               ["sold","Sold Out"],["feat","Destacados"],["new","Nuevos"]];
function renderFilters(){
  $("filters").innerHTML=FILTERS.map(([k,l])=>
    `<button class="chip ${filter===k?'on':''}" onclick="setFilter('${k}')">${l}</button>`).join("");
}
function setFilter(f){filter=f;renderFilters();renderList();}
function passes(p){
  if(filter==="active")return !p.hidden;
  if(filter==="hidden")return !!p.hidden;
  if(filter==="sold")return !!p.sold_out;
  if(filter==="feat")return !!p.featured;
  if(filter==="new")return !!p.is_new;
  return true;
}

async function loadProducts(){
  const r=await sb.from("products").select("*").eq("store_id",STORE_ID).order("position");
  products=r.data||[];renderList();
}

function money(n){return n==null?"Consultar":"$"+Number(n).toLocaleString("en-US",{maximumFractionDigits:0});}
function categoryName(id){const c=categories.find(x=>x.id===id);return c?c.name:'—';}

function renderList(){
  const list=products.filter(passes);
  $("count").textContent=`${list.length} de ${products.length}`;
  if(!list.length){$("list").innerHTML=`<div class="empty">Nada en este filtro.</div>`;return;}
  $("list").innerHTML=list.map(p=>{
    const i=products.findIndex(x=>x.id===p.id);
    const foto=(Array.isArray(p.images)&&p.images.length)?p.images[0]:p.image_url;
    const checked=selectedIds[p.id]?'checked':'';
    const badges=[
      p.is_new?'<span class="badge b-new">New</span>':'',
      p.featured?'<span class="badge b-feat">★ Destacado</span>':'',
      p.sold_out?'<span class="badge b-sold">Sold Out</span>':'',
      p.hidden?'<span class="badge b-hide">Oculto</span>':''
    ].join("");
    const precio = p.discount_price!=null
      ? `<s>${money(p.price)}</s>${money(p.discount_price)}`
      : money(p.price);
    return `<div class="item ${p.hidden?'dim':''} ${selectedIds[p.id]?'selected':''}" id="pi-${p.id}">
      <input type="checkbox" class="psel" data-id="${p.id}" ${checked} onchange="toggleSelect(${p.id},this.checked)">
      <div class="arrows">
        <button class="mini" onclick="move(${p.id},-1)" ${i===0?'disabled style="opacity:.25"':''}>▲</button>
        <button class="mini" onclick="move(${p.id},1)" ${i===products.length-1?'disabled style="opacity:.25"':''}>▼</button>
      </div>
      ${foto?`<img src="${foto}" onerror="this.style.opacity=.15">`:'<div class="noimg">📷</div>'}
      <div class="it-info">
        <div class="it-cat">${categoryName(p.category_id)}</div>
        <div class="it-name">${p.name}</div>
        <div class="it-price">${precio}</div>
        ${badges?`<div class="badges">${badges}</div>`:''}
      </div>
      <div class="it-btns">
        <button class="ib ib-edit" onclick="editProduct(${p.id})">✎</button>
        <button class="ib ib-del" onclick="delProduct(${p.id},'${(p.name||'').replace(/'/g,'')}')">🗑</button>
      </div>
    </div>`;
  }).join("");
}

/* ---------- PEDIDOS (nuevo) ---------- */
async function loadOrders(){
  const r=await sb.from("orders").select("*").eq("store_id",STORE_ID).order("created_at",{ascending:false});
  orders=r.data||[];renderOrders();
}
function renderOrders(){
  const q=($("orderSearch").value||"").trim().toLowerCase();
  const list=orders.filter(o=>!q||(o.customer_name||'').toLowerCase().includes(q)||(o.order_number||'').toLowerCase().includes(q));
  $("orderCount").textContent=`${list.length} de ${orders.length}`;
  const el=$("ordersList");
  if(!list.length){el.innerHTML=`<div class="empty">Todavía no hay pedidos</div>`;return;}
  el.innerHTML=list.map(o=>{
    const items=Array.isArray(o.items)?o.items:[];
    const itemsHtml=items.map(i=>`• ${i.qty||1}x ${i.name} — $${i.price}`).join("<br>");
    const place=o.note==='Envío'?('📦 '+(o.customer_address||'')):'🤝 Personal (coordinar)';
    const date=o.created_at?new Date(o.created_at).toLocaleString('es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    const opts=['pendiente','pagado','enviado','cancelado'].map(s=>
      `<option value="${s}" ${o.status===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("");
    return `<div class="order-card">
      <div class="order-top"><span class="order-num">${o.order_number}</span><span class="order-date">${date}</span></div>
      <div class="order-cust">${o.customer_name}</div>
      <div class="order-phone">${o.customer_phone||''}</div>
      <div class="order-addr">${place}</div>
      <div class="order-items">${itemsHtml}</div>
      <div class="order-foot"><span class="order-total">$${o.total}</span>
        <select class="order-status" data-id="${o.id}" onchange="updateOrderStatus(this)">${opts}</select></div>
    </div>`;
  }).join("");
}
async function updateOrderStatus(sel){
  await sb.from("orders").update({status:sel.value}).eq("id",Number(sel.dataset.id)).eq("store_id",STORE_ID);
}
</script>
